name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bluetooth dependency
        run: python -m pip install bleak==3.0.2
      - name: Check Python syntax
        run: python -m compileall -q source
      - name: Run offline tests
        run: python source/test_protocol.py
